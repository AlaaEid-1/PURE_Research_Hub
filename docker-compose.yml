services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pure_research_hub
      - DB_USERNAME=pure_user
      - DB_PASSWORD=secret
    depends_on:
      - db

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pure_research_hub
      - DB_USERNAME=pure_user
      - DB_PASSWORD=secret
    command: ["php", "artisan", "queue:work", "mysql", "--tries=3", "--timeout=120"]
    depends_on:
      - db
      - app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pure_research_hub
      - DB_USERNAME=pure_user
      - DB_PASSWORD=secret
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - db
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pure_research_hub
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: pure_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
