; PURE Research Hub - PHP FPM per-directory configuration
; This file overrides PHP-FPM limits for the public/ web root.
; Ensures 100MB PDF uploads work even if server-level php.ini differs.
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
